services:
  client:
    image: ${DOCKERHUB_USERNAME}/taskmaster-client:${CLIENT_IMAGE_TAG}
    ports:
      - "${CLIENT_PORT:-80}:80"            # Use CLIENT_PORT env var or default to 80
    environment:
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL_DOCKER}

  server:
    image: ${DOCKERHUB_USERNAME}/taskmaster-server:${SERVER_IMAGE_TAG}
    ports:
      - "${SERVER_PORT:-5000}:5000"        # Use SERVER_PORT env var or default to 5000
    environment:
      - MONGODB_URI=${MONGODB_URI}         # This is the prod uri atm
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - REACT_APP_FRONTEND_URL=${REACT_APP_FRONTEND_URL_DOCKER}
      - MAIL_SERVICE=${MAIL_SERVICE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
  