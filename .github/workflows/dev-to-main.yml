name: Deploy to production environment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment files
        run: |
          # Create .env file from secrets
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
          echo "SERVER_HOST=${{ secrets.SERVER_HOST }}" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "REACT_APP_BACKEND_URL_DOCKER=${{ secrets.REACT_APP_BACKEND_URL_DOCKER }}" >> .env
          echo "REACT_APP_FRONTEND_URL_DOCKER=${{ secrets.REACT_APP_FRONTEND_URL_DOCKER }}" >> .env
          echo "MAIL_SERVICE=${{ secrets.MAIL_SERVICE }}" >> .env
          echo "MAIL_USER=${{ secrets.MAIL_USER }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          # Add environment-specific port mappings
          echo "CLIENT_PORT=${{ secrets.CLIENT_PORT }}" >> .env
          echo "SERVER_PORT=${{ secrets.SERVER_PORT }}" >> .env
          # Use stable tag for production
          echo "CLIENT_IMAGE_TAG=stable" >> .env
          echo "SERVER_IMAGE_TAG=stable" >> .env

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.deploy.yml,.env,deploy.sh"
          target: "~/taskmaster-production"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/taskmaster-production
            chmod +x deploy.sh
            ./deploy.sh
