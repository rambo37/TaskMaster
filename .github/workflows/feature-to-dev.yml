name: Build and Deploy to testing environment

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_TAG: ${{ github.sha }}  # Create an environment variable for commit hash

# Eventualy add a job to run some tests - that would probably be a prerequisite for the build-and-push job

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build client image
        run: docker build -f client/Dockerfile --target prod -t $DOCKERHUB_USERNAME/taskmaster-client:latest -t $DOCKERHUB_USERNAME/taskmaster-client:${{ env.IMAGE_TAG }} .

      - name: Build server image
        run: docker build -f server/Dockerfile --target prod -t $DOCKERHUB_USERNAME/taskmaster-server:latest -t $DOCKERHUB_USERNAME/taskmaster-server:${{ env.IMAGE_TAG }} .

      - name: Push images
        run: |
          docker push $DOCKERHUB_USERNAME/taskmaster-client:latest
          docker push $DOCKERHUB_USERNAME/taskmaster-client:${{ env.IMAGE_TAG }}
          docker push $DOCKERHUB_USERNAME/taskmaster-server:latest
          docker push $DOCKERHUB_USERNAME/taskmaster-server:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment files
        run: |
          # Create .env file from secrets
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
          echo "SERVER_HOST=${{ secrets.SERVER_HOST }}" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "REACT_APP_BACKEND_URL_DOCKER=${{ secrets.REACT_APP_BACKEND_URL_DOCKER }}" >> .env
          echo "REACT_APP_FRONTEND_URL_DOCKER=${{ secrets.REACT_APP_FRONTEND_URL_DOCKER }}" >> .env
          echo "MAIL_SERVICE=${{ secrets.MAIL_SERVICE }}" >> .env
          echo "MAIL_USER=${{ secrets.MAIL_USER }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          # Add environment-specific port mappings
          echo "CLIENT_PORT=${{ secrets.CLIENT_PORT }}" >> .env
          echo "SERVER_PORT=${{ secrets.SERVER_PORT }}" >> .env

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.deploy.yml,.env,deploy.sh"
          target: "~/taskmaster"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/taskmaster
            chmod +x deploy.sh
            ./deploy.sh
